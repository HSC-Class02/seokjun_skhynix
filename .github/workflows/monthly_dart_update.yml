name: Monthly DART update and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 28-31 * *" # Filter to the first day in Asia/Seoul
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check monthly schedule in Korea time
        id: schedule_check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "Not the first day in Korea; skipping scheduled update."
          fi

      - name: Setup Python
        if: steps.schedule_check.outputs.run_update == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate DART API secret
        if: steps.schedule_check.outputs.run_update == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        shell: bash
        run: |
          if [ -z "${OPENDART_API_KEY:-}" ]; then
            echo "::error::GitHub Actions secret OPENDART_API_KEY is missing or empty."
            echo "Create it at Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "OPENDART_API_KEY is configured."

      - name: Fetch DART
        if: steps.schedule_check.outputs.run_update == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/fetch_dart.py

      - name: Analyze
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python scripts/analyze.py

      - name: Build dashboard
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python scripts/build_dashboard.py

      - name: Validate generated outputs
        if: steps.schedule_check.outputs.run_update == 'true'
        shell: bash
        run: |
          test -s data/processed/financials.json
          test -s docs/index.html
          echo "Generated data and dashboard files are present."

      - name: Commit data and dashboard
        if: steps.schedule_check.outputs.run_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data/dashboard changes to commit."
          else
            git commit -m "chore: update DART financial data"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
