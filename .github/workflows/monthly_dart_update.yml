name: Monthly DART update and deploy

on:
  workflow_dispatch:
  # GitHub cron is UTC. 17:00 UTC is 02:00 the following day in Korea.
  # Run daily and let the Seoul-time guard below select the first day of each month.
  schedule:
    - cron: "0 17 * * *"
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      run_update: ${{ steps.schedule_check.outputs.run_update }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check monthly schedule in Korea time
        id: schedule_check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "Not the first day in Korea; skipping scheduled update."
          fi

      - name: Setup Python
        if: steps.schedule_check.outputs.run_update == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate DART API secret
        if: steps.schedule_check.outputs.run_update == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        shell: bash
        run: |
          if [ -z "${OPENDART_API_KEY:-}" ]; then
            echo "::error::DART API secret is missing or empty."
            echo "Create repository secret OPENDART_API_KEY (recommended) or DART_API_KEY."
            echo "Go to Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "A DART API secret is configured."

      - name: Fetch DART
        if: steps.schedule_check.outputs.run_update == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py

      - name: Analyze
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python scripts/analyze.py

      - name: Build dashboard
        if: steps.schedule_check.outputs.run_update == 'true'
        run: python scripts/build_dashboard.py

      - name: Validate generated outputs
        if: steps.schedule_check.outputs.run_update == 'true'
        shell: bash
        run: |
          test -s data/processed/financials.json
          test -s docs/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("data/processed/financials.json").read_text(encoding="utf-8"))
          if not isinstance(records, list) or not records:
              raise SystemExit("financials.json must contain a non-empty JSON array")
          html = Path("docs/index.html").read_text(encoding="utf-8")
          if "SK hynix Financial Dashboard" not in html or "DATA_JSON" in html:
              raise SystemExit("Dashboard HTML did not render the data placeholder correctly")
          print(f"Validated {len(records)} financial records and dashboard HTML.")
          PY

      - name: Commit data and dashboard
        if: steps.schedule_check.outputs.run_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data/dashboard changes to commit."
          else
            git commit -m "chore: update DART financial data"
            git push
          fi

  deploy:
    needs: update
    if: needs.update.outputs.run_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
